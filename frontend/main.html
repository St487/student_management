<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="my-container">
        <div class="title bg bg-primary text-white">
            <h2 class="p-3"> 
                <span class="bi bi-mortarboard m-3"></span>
                Student Profile Management System
            </h2>
        </div>

        <div class="table-new-student">

            <h5 class="form-label d-flex align-items-center mb-4">
                <span class="avatar bi bi-person-fill bg-primary text-white me-3"></span>
                Add New Student Profile
            </h5>

            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <p class="form-label">1. Matric Number</p>
                    <input type="text" id="matric" class="form-control mb-3" placeholder="e.g., 300128">
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <p class="form-label">2. Full Name</p>
                    <input type="text" id="name" class="form-control mb-3" placeholder="e.g., Ali bin Abu">
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <p class="form-label">3. Email Address</p>
                    <input type="email" id="email" class="form-control mb-3" placeholder="e.g., ali@email.com">
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <p class="form-label">4. Semester</p>

                    <input type="number" id="semester" class="form-control mb-3" min="1" max="8" placeholder="e.g., 6">
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <p class="form-label">5. Date of Birth</p>
                    <input type="date" id="dob" class="form-control mb-3">
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <p class="form-label">8. Program</p>

                    <div class="select-wrapper">
                        <select id="program" name="program" class="form-control">
                            <option value="">Select a program</option>
                            <option value="computer-science">Computer Science</option>
                            <option value="mathematics">Mathematics</option>
                            <option value="physics">Physics</option>
                        </select>

                        <span class="dropdown-icon">
                            <i class="bi bi-chevron-down"></i>
                        </span>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="row">
                        <div class="col-12 col-md-6">
                            <p class="form-label">6. Gender</p>
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                            <label class="form-check-label me-3" for="male">
                                Male
                            </label>
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                            <label class="form-check-label" for="female">
                                Female
                            </label>
                        </div>
                        <div class="col-12 col-md-6">
                            <p class="form-label">7. Hobbies</p>

                            <div class="d-flex flex-column gap-1">

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" id="reading" value="reading">
                                    <label class="form-check-label" for="reading">Reading</label>
                                </div>
 
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" id="sports" value="sports">
                                    <label class="form-check-label" for="sports">Sports</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" id="music" value="music">
                                    <label class="form-check-label" for="music">Music</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" id="traveling" value="traveling">
                                    <label class="form-check-label" for="traveling">Traveling</label>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                
            </div>

            <div class="d-flex justify-content-center">

                <button onclick="addStudentLocalStorage()" class="btn btn-success mt-3"><span class="bi bi-floppy2-fill me-3"></span>Add Student</button>

                <button onclick="clearForm()" class="btn btn-secondary mt-3 ms-2"><span class="bi bi-arrow-repeat me-2"></span> Clear Form</button>

            </div>
        </div>

        <div class="table-student-profile">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">

                <h5 class="form-label d-flex align-items-center mb-0">
                    <span class="avatar bi bi-table bg-primary text-white me-3"></span>
                    Student Profiles
                </h5>

                <div class="d-flex gap-3">
                    <div class="select-wrapper search-box">
                        <input type="text" id="search" class="form-control" placeholder="Search by matric number or name" onkeyup="searchStudent(); toggleSearchIcon()">

                        <span class="search-icon" onclick="clearSearch()">
                            <i id="searchIcon" class="bi bi-search"></i>
                        </span>
                    </div>
                        <button onclick="viewStudents()" class="btn btn-info"><span class="bi bi-arrow-clockwise me-2"></span>Refresh</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <tr class="table-dark">
                        <th>Matric Number</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Semester</th>
                        <th>Date of Birth</th>
                        <th>Gender</th>
                        <th>Program</th>
                        <th>Hobbies</th>
                        <th>Actions</th>
                    </tr>

                    <tbody id="studentTableBody">
                    </tbody>

                </table>
            </div>

        </div>

    </div>
    <script src="main.js"></script>
</body>
</html>
